name: Repair Prometheus panorama

on:
  push:
    branches:
      - agent/fix-prometheus-quality-title-v2

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-prometheus-quality-title-v2
          fetch-depth: 0
      - name: Rebuild asset and patch scene
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          marker = Path('.prometheus-ready')
          if not marker.exists():
              raise SystemExit('Prometheus repair marker missing')

          parts = sorted(Path('.prometheus-parts').glob('part*.txt'))
          if len(parts) != 12:
              raise SystemExit(f'Expected 12 panorama chunks, found {len(parts)}')

          chunks = []
          for p in parts:
              chunk = p.read_text().strip()
              if p.name == 'part07.txt' and len(chunk) == 5999:
                  broken = 'KFMkdAEj4adJymiOPF'
                  fixed = 'KFMkdAEj4adJnymiOPF'
                  if broken not in chunk:
                      raise SystemExit('Known chunk repair point not found')
                  chunk = chunk.replace(broken, fixed, 1)
              chunks.append(chunk)

          payload = ''.join(chunks)
          raw = base64.b64decode(payload, validate=True)
          expected_sha256 = 'd3b828c22438544fdb38ed11c47b159a41a407ff0e284c973e6fcdcecd00a1b6'
          actual_sha256 = hashlib.sha256(raw).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(f'Panorama SHA mismatch: {actual_sha256}')

          asset = Path('public/assets/scene-prometheus-bound.avif')
          asset.write_bytes(raw)

          register = Path('src/registerPrometheusBound.ts')
          text = register.read_text()
          text = text.replace("import prometheusBoundPanorama from './prometheusBoundPanorama'\n", '')
          text = text.replace("location: 'The Caucasus, mythic eastern frontier',", "location: 'The Caucasus, traditional ancient placement',")
          text = text.replace("mapConfidence: 'mythic',", "mapConfidence: 'traditional',")
          text = text.replace("image: `data:image/jpeg;base64,${prometheusBoundPanorama}`", "image: './assets/scene-prometheus-bound.avif'")
          text = text.replace("location: 'Kafkaslar, mitolojik doğu sınırı',", "location: 'Kafkaslar, geleneksel antik yerleştirme',")
          register.write_text(text)

          i18n = Path('src/i18n.ts')
          text = i18n.read_text()
          needle = "  'Prometheus Steals Fire': 'Prometheus Ateşi Çalıyor',\n"
          addition = needle + "  'Prometheus Bound': 'Zincire Vurulmuş Prometheus',\n"
          if "'Prometheus Bound': 'Zincire Vurulmuş Prometheus'" not in text:
              if needle not in text:
                  raise SystemExit('Prometheus translation insertion point not found')
              text = text.replace(needle, addition, 1)
          i18n.write_text(text)
          PY

          rm -f src/prometheusBoundPanorama.ts .prometheus-ready
          rm -rf .prometheus-parts
          rm -f .github/workflows/repair-prometheus.yml

          git config user.name "MYTHOS repair bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix Prometheus panorama quality and Turkish title"
          git push origin HEAD:agent/fix-prometheus-quality-title-v2
