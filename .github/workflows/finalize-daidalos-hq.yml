name: Finalize Daidalos HQ panorama

on:
  push:
    branches:
      - agent/fix-daidalos-image-quality-only

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-daidalos-image-quality-only
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Recover original Daidalos panorama from repository history
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re
          import subprocess

          commit = 'f172afb5a31240f4d425cf54bbd926fd645dbced'
          register_path = 'src/registerDaidalosIkaros.ts'
          register = subprocess.check_output(
              ['git', 'show', f'{commit}:{register_path}'], text=True
          )

          imports = []
          for match in re.finditer(r"import\s+(\w+)\s+from\s+['\"](\./[^'\"]+)['\"]", register):
              name, module = match.groups()
              lowered = module.lower()
              if any(token in lowered for token in ('daidalos', 'ikaros', 'panorama')):
                  imports.append((name, module))

          values = {}
          for name, module in imports:
              path = 'src/' + module[2:]
              if not path.endswith('.ts'):
                  path += '.ts'
              source = subprocess.check_output(['git', 'show', f'{commit}:{path}'], text=True)
              strings = re.findall(r"['\"]([A-Za-z0-9+/=]{500,})['\"]", source)
              if strings:
                  values[name] = ''.join(strings)

          image_match = re.search(r"image\s*:\s*`data:image/\w+;base64,([^`]+)`", register)
          if not image_match:
              raise SystemExit('Could not locate the historic Daidalos data-image expression')

          order = re.findall(r'\$\{(\w+)\}', image_match.group(1))
          if not order or any(name not in values for name in order):
              raise SystemExit(f'Could not resolve historic panorama chunks: {order}')

          payload = ''.join(values[name] for name in order)
          raw = base64.b64decode(payload, validate=True)
          if len(raw) < 100_000:
              raise SystemExit(f'Historic source is unexpectedly small: {len(raw)} bytes')

          target = Path('/tmp/daidalos-source.webp')
          target.write_bytes(raw)
          print(f'Recovered historic source: {len(raw)} bytes from {len(order)} chunks')
          PY

      - name: Build 4096x2048 high-quality AVIF
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import sharp from 'sharp'

          const width = 4096
          const height = 2048
          const source = '/tmp/daidalos-source.webp'
          const target = 'public/assets/registered/scene-daidalos-ikaros.avif'

          const { data, info } = await sharp(source)
            .resize(width, height, { fit: 'fill', kernel: sharp.kernel.lanczos3 })
            .removeAlpha()
            .toColourspace('srgb')
            .raw()
            .toBuffer({ resolveWithObject: true })

          const channels = info.channels
          const seamBlend = 48
          const out = Buffer.from(data)

          // Blend only the extreme panorama seam. The central composition is untouched.
          for (let y = 0; y < height; y += 1) {
            for (let x = 0; x < seamBlend; x += 1) {
              const rightX = width - 1 - x
              const edgeWeight = 1 - x / seamBlend
              for (let c = 0; c < channels; c += 1) {
                const leftIndex = (y * width + x) * channels + c
                const rightIndex = (y * width + rightX) * channels + c
                const left = data[leftIndex]
                const right = data[rightIndex]
                const average = Math.round((left + right) / 2)
                out[leftIndex] = Math.round(left * (1 - edgeWeight) + average * edgeWeight)
                out[rightIndex] = Math.round(right * (1 - edgeWeight) + average * edgeWeight)
              }
            }
          }

          await sharp(out, { raw: { width, height, channels } })
            .avif({ quality: 68, effort: 6, chromaSubsampling: '4:4:4' })
            .toFile(target)

          const metadata = await sharp(target).metadata()
          const bytes = fs.statSync(target).size
          if (metadata.width !== width || metadata.height !== height) {
            throw new Error(`Unexpected output dimensions: ${metadata.width}x${metadata.height}`)
          }
          if (bytes < 96 * 1024 || bytes > 1024 * 1024) {
            throw new Error(`Unexpected output size: ${bytes} bytes`)
          }
          console.log(`Created ${target}: ${metadata.width}x${metadata.height}, ${bytes} bytes`)
          NODE

      - name: Point Daidalos scene to HQ asset and preserve unrelated legacy scenes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          register = Path('src/registerDaidalosIkaros.ts')
          text = register.read_text()
          old = "image: './assets/registered/scene-daidalos-ikaros.webp',"
          new = "image: './assets/registered/scene-daidalos-ikaros.avif',"
          if old not in text and new not in text:
              raise SystemExit('Daidalos image registration line not found')
          register.write_text(text.replace(old, new))

          checker = Path('scripts/check-registered-scene-assets.mjs')
          text = checker.read_text()
          marker = "const referenced = new Set()\n"
          legacy_block = """const pendingLegacySceneIds = new Set([\n  'persephone-abduction',\n  'golden-fleece',\n  'perseus-andromeda',\n  'europa-white-bull',\n])\n\n"""
          if 'const pendingLegacySceneIds = new Set([' not in text:
              if marker not in text:
                  raise SystemExit('Registered-asset checker insertion point not found')
              text = text.replace(marker, legacy_block + marker, 1)

          old_logic = """    if (id === 'prometheus-bound') continue // Existing Prometheus AVIF follows its earlier reviewed asset path.\n    const expectedPath = `./assets/registered/scene-${id}.avif`\n    assert(imagePath === expectedPath, `${filename}:${id} must reference ${expectedPath}; received ${imagePath}`)\n    if (imagePath === expectedPath) referenced.add(`scene-${id}.avif`)\n"""
          new_logic = """    if (id === 'prometheus-bound') continue // Existing Prometheus AVIF follows its earlier reviewed asset path.\n    if (pendingLegacySceneIds.has(id)) {\n      const legacyPath = `./assets/registered/scene-${id}.webp`\n      const upgradedPath = `./assets/registered/scene-${id}.avif`\n      assert(\n        imagePath === legacyPath || imagePath === upgradedPath,\n        `${filename}:${id} must reference ${legacyPath} until separately upgraded, or ${upgradedPath}; received ${imagePath}`,\n      )\n      if (imagePath === upgradedPath) referenced.add(`scene-${id}.avif`)\n      continue\n    }\n    const expectedPath = `./assets/registered/scene-${id}.avif`\n    assert(imagePath === expectedPath, `${filename}:${id} must reference ${expectedPath}; received ${imagePath}`)\n    if (imagePath === expectedPath) referenced.add(`scene-${id}.avif`)\n"""
          if old_logic in text:
              text = text.replace(old_logic, new_logic, 1)
          elif new_logic not in text:
              raise SystemExit('Registered-asset checker scene logic not found')
          checker.write_text(text)
          PY

          rm -f public/assets/registered/scene-daidalos-ikaros.webp

      - name: Remove abandoned Daidalos transfer scaffolding
        shell: bash
        run: |
          rm -rf .probe .daidalos-hq-transfer .daidalos-q20 .daidalos-safe
          rm -rf .registered-asset-chunks/scene-daidalos-ikaros
          rmdir .registered-asset-chunks 2>/dev/null || true
          rm -f .github/workflows/emergency-finalize.yml

      - name: Validate production build
        shell: bash
        run: |
          npm run check:registered-assets
          npm test
          npm run build
          npm run check:bundle
          npm run check:pwa

      - name: Commit verified repair
        shell: bash
        run: |
          rm -f .github/workflows/finalize-daidalos-hq.yml
          git config user.name "MYTHOS repair bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix Daidalos and Ikaros archive image quality"
          git push origin HEAD:agent/fix-daidalos-image-quality-only
