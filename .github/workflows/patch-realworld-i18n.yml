name: Patch real-world myth titles

on:
  push:
    branches:
      - agent/fix-ikaros-and-add-realworld-myths

permissions:
  contents: write

jobs:
  patch:
    if: ${{ hashFiles('.realworld-i18n-ready') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ikaros-and-add-realworld-myths
          fetch-depth: 0
      - name: Add explicit Turkish myth titles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/i18n.ts')
          text = path.read_text()
          replacements = [
              (
                  "  'Prometheus Bound': 'Zincire Vurulmuş Prometheus',\n",
                  "  'Prometheus Bound': 'Zincire Vurulmuş Prometheus',\n  'Daidalos and Ikaros': 'Daidalos ve Ikaros',\n",
              ),
              (
                  "  'Perseus and the Sea Monster': 'Perseus ve Deniz Canavarı',\n",
                  "  'Perseus and the Sea Monster': 'Perseus ve Deniz Canavarı',\n  'Perseus and Andromeda': 'Perseus ve Andromeda',\n",
              ),
              (
                  "  'Jason and the Colchian Dragon': 'Iason ve Kolkhis Ejderhası',\n",
                  "  'Jason and the Colchian Dragon': 'Iason ve Kolkhis Ejderhası',\n  'Jason and the Golden Fleece': 'Iason ve Altın Post',\n",
              ),
              (
                  "  'Europa and the Bull': 'Europa ve Boğa',\n",
                  "  'Europa and the Bull': 'Europa ve Boğa',\n  'Europa and the White Bull': 'Europa ve Beyaz Boğa',\n",
              ),
          ]
          for old, new in replacements:
              if new.strip() in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Missing title insertion point: {old.strip()}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          rm -f .realworld-i18n-ready
          rm -f .github/workflows/patch-realworld-i18n.yml
          git config user.name "MYTHOS localization bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Turkish titles for registered myth scenes"
          git push origin HEAD:agent/fix-ikaros-and-add-realworld-myths
