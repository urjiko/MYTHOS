name: Finalize native Daidalos panorama

on:
  push:
    branches: [agent/real-daidalos-native-hq]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-daidalos-native-hq
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconstruct exact native-detail panorama
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/registered
          cat .daidalos-native/chunk*.txt | tr -d '\r\n' | base64 --decode > public/assets/registered/scene-daidalos-ikaros-native.webp
          echo 'd4f963db8f14a7ec7db24b4bd2f23e1965de6ec9b3f861fe4d8eccbada46708c  public/assets/registered/scene-daidalos-ikaros-native.webp' | sha256sum -c -
          test "$(stat -c%s public/assets/registered/scene-daidalos-ikaros-native.webp)" = "189892"
      - name: Run release gates on the real source
        run: |
          npm run generate:panorama-assets
          npm run check:assets
          npm run check:registered-assets
          npm run test
          npm run build
          npm run check:bundle
          npm run check:pwa
      - name: Commit validated native source and remove failed staging debris
        shell: bash
        run: |
          set -euo pipefail
          rm -f public/assets/registered/scene-daidalos-ikaros.webp
          rm -rf .daidalos-native .daidalos-hq-transfer .daidalos-q20 .daidalos-safe .probe
          rm -f .github/workflows/finalize-daidalos-hq.yml
          rm -f .github/workflows/finalize-daidalos-native.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore Daidalos from native high-detail panorama'
          git push origin HEAD:agent/real-daidalos-native-hq
